[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pm4py-ucm"
version = "0.5.2"
description = "Use Case Map (URN/UCM) extension for PM4Py — process mining → jUCMNav"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "pm4py-ucm contributors" },
]
keywords = [
    "process-mining",
    "pm4py",
    "use-case-maps",
    "ucm",
    "urn",
    "jucmnav",
    "requirements-engineering",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "graphviz>=0.20",
    "Pillow>=10.0",
]

[project.optional-dependencies]
pm4py = ["pm4py>=2.7"]
viz = ["matplotlib>=3.5"]
dev = [
    "pytest>=7.0",
    "pm4py>=2.7",
    "matplotlib>=3.5",
]

[project.urls]
Homepage = "https://github.com/ProcessMining-uOttawa/pm4py-ucm"
Issues = "https://github.com/ProcessMining-uOttawa/pm4py-ucm/issues"
Changelog = "https://github.com/ProcessMining-uOttawa/pm4py-ucm/blob/main/CHANGELOG.md"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["pm4py_ucm*"]
exclude = ["tests*", "examples*"]
