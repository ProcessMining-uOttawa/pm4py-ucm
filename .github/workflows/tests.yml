name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # A version that is tested but not yet claimed (see `experimental`
    # below) reports its result without failing the workflow: a dependency
    # that has no wheel for a brand-new Python is news, not a broken build.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        # The claimed versions — keep in step with `requires-python` and
        # the classifiers in pyproject.toml, and the badge in README.md.
        # (3.9 left at its end of life: ubuntu-latest no longer offers it.)
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        experimental: [false]
        include:
          # Tested ahead of being claimed. Move it into the list above,
          # and add its classifier, once this job is green.
          - python-version: "3.14"
            experimental: true

    steps:
      - name: Check out repository
        # v5+ runs on the Node 24 action runtime (Node 20 is
        # deprecated on GitHub-hosted runners as of late 2025).
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Graphviz binary
        # The graphviz Python wheel ships bindings only: the layout engine
        # and the visualization tests need the `dot` binary on PATH.
        # (The three skips the suite reports are unrelated to Graphviz —
        # they want a reference .jucm fixture that is not checked in.)
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run pytest
        run: pytest -v --tb=short
