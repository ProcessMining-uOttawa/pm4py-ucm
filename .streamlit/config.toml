# Streamlit config for the pm4py-ucm web front-end.
#
# Upload-size policy is two-tier and enforced in two layers:
#
#   * Server layer (this file) — raised to 1 GB so a local user can
#     mine full production-sized event logs without hitting the wall
#     at 75 MB.
#   * App layer (web/streamlit_app*.py) — when the app detects it is
#     running on Streamlit Community Cloud (via the ``HOSTNAME`` /
#     ``/mount/src`` deployment fingerprints), it enforces its OWN
#     75 MB cap on ``st.file_uploader`` payloads to keep a public
#     deployment from being DoS'd by a single upload. Local runs
#     bypass that check and get the full 1 GB.
#
# So the effective ceilings are: local = 1 GB, Community Cloud = 75 MB.
# The Community Cloud check is deliberately conservative — if you
# fork the repo and self-host on a private server, you get the local
# 1 GB ceiling by default.

[server]
# Server-side upload cap in megabytes. 1024 = 1 GB. The app layer
# clamps this back down on Community Cloud (see the note above).
maxUploadSize = 1024

# Cap WebSocket message size (also megabytes). Mostly relevant for
# render outputs (PNG bytes). 100 MB is well above any realistic
# graphviz render.
maxMessageSize = 100

[browser]
# Don't phone home with usage stats.
gatherUsageStats = false
